name: Windows-VNC-Sentinel
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Install TightVNC & Ngrok
        run: |
          # Install TightVNC Server
          choco install tightvnc -y
          # Install Ngrok
          choco install ngrok -y

      - name: 2. Configure VNC Password
        shell: powershell
        run: |
          # Setting VNC Password to 'rohan2026'
          $pass = "rohan2026"
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-install" -Wait
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-controlpass=$pass", "-vncpass=$pass"

      - name: 3. Start Ngrok Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          # Expose VNC Port 5900
          Start-Process ngrok -ArgumentList "tcp 5900"
          Start-Sleep -s 10
          
          # Fetch the Public Address
          $uri = (Invoke-RestMethod http://localhost:4040/api/tunnels).tunnels[0].public_url
          $clean_uri = $uri -replace "tcp://", ""
          
          echo "=========================================="
          echo "   REALVNC CONNECTION DETAILS             "
          echo "=========================================="
          echo " ADDRESS: $clean_uri"
          echo " NAME: Windows Master"
          echo " PASSWORD: rohan2026"
          echo "=========================================="

      - name: 4. Keep Alive
        run: |
          $i = 0
          while($i -lt 360) {
            Write-Output "Windows Sentinel is Active..."
            Start-Sleep -s 60
            $i++
          }
