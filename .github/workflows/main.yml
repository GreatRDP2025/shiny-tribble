name: Windows-VNC-Sentinel
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Install TightVNC & Ngrok
        run: |
          choco install tightvnc -y
          choco install ngrok -y

      - name: 2. Configure VNC Password (Silent Registry)
        shell: powershell
        run: |
          # Kill any stuck server process
          taskkill /F /IM tvnserver.exe /T 2>$null
          
          # Registry setup for 'rohan202' (Note: VNC passwords are capped at 8 chars)
          # 'rohan202' in DES-encrypted VNC format
          $regPath = "HKLM:\SOFTWARE\TightVNC\Server"
          if (!(Test-Path $regPath)) { New-Item -Path $regPath -Force }
          
          # This hex represents the encrypted 'rohan202'
          [byte[]]$hexPass = 0x24, 0x4D, 0x45, 0x33, 0x05, 0xBC, 0x6E, 0x5B
          Set-ItemProperty -Path $regPath -Name "ControlPassword" -Value $hexPass
          Set-ItemProperty -Path $regPath -Name "Password" -Value $hexPass
          
          # Start the server properly
          & "C:\Program Files\TightVNC\tvnserver.exe" -install
          & "C:\Program Files\TightVNC\tvnserver.exe" -start

      - name: 3. Start Ngrok Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          Start-Process ngrok -ArgumentList "tcp 5900 --log=stdout"
          Start-Sleep -s 15
          
          $uri = (Invoke-RestMethod http://localhost:4040/api/tunnels).tunnels[0].public_url
          $clean_uri = $uri -replace "tcp://", ""
          
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host " ADDRESS: $clean_uri" -ForegroundColor Yellow
          Write-Host " NAME: Windows Master" -ForegroundColor White
          Write-Host " PASSWORD: rohan202" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Cyan

      - name: 4. Keep Alive
        shell: powershell
        run: |
          $i = 0
          while($i -lt 360) {
            Write-Output "Windows Sentinel is Active..."
            Start-Sleep -s 60
            $i++
          }
