name: Sovereign-RDP-Sentinel
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    steps:
      - name: 1. Configure Windows RDP
        run: |
          # Enable RDP and allow connections
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # Punch hole in Windows Firewall
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389

      - name: 2. Create Sovereign User
        run: |
          # Creating user 'RDP' with password 'rohan2026'
          $password = "rohan2026"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: 3. Install & Start Tailscale
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -OutFile "tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "tailscale.msi", "/quiet", "/norestart" -Wait
          
          # Start Tailscale using your Secret Key
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=windows-master
          
          # Get the assigned IP
          $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: 4. Final Connection Info
        run: |
          Write-Host "===============================" -ForegroundColor Cyan
          Write-Host "SENTINEL RDP IS LIVE" -ForegroundColor Green
          Write-Host "IP ADDRESS: $env:TAILSCALE_IP" -ForegroundColor Yellow
          Write-Host "USERNAME: RDP" -ForegroundColor White
          Write-Host "PASSWORD: rohan2026" -ForegroundColor Yellow
          Write-Host "===============================" -ForegroundColor Cyan
          
          # Keep Alive
          while ($true) { Start-Sleep -Seconds 300 }
