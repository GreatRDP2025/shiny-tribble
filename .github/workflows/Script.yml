name: Windows-VNC-Sentinel
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. Install TightVNC & Ngrok
        run: |
          # Install TightVNC Server
          choco install tightvnc -y
          # Install Ngrok
          choco install ngrok -y

            - name: 2. Configure VNC Password (Silent Mode)
        shell: powershell
        run: |
          # Kill any existing server process
          taskkill /F /IM tvnserver.exe /T 2>$null
          
          # The password 'rohan2026' in its hashed registry format
          # This bypasses the interactive prompt entirely
          $regPath = "HKLM:\SOFTWARE\TightVNC\Server"
          if (!(Test-Path $regPath)) { New-Item -Path $regPath -Force }
          
          # Set the Control and Primary passwords silently
          # Note: These are hex-encoded strings for 'rohan2026'
          Set-ItemProperty -Path $regPath -Name "ControlPassword" -Value ([byte[]](0x72,0x6f,0x68,0x61,0x6e,0x32,0x30,0x32,0x36))
          Set-ItemProperty -Path $regPath -Name "Password" -Value ([byte[]](0x72,0x6f,0x68,0x61,0x6e,0x32,0x30,0x32,0x36))
          
          # Start the server as a service
          & "C:\Program Files\TightVNC\tvnserver.exe" -install
          & "C:\Program Files\TightVNC\tvnserver.exe" -start

      - name: 3. Start Ngrok Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          # Use --log=stdout to prevent ngrok from opening a new dashboard window
          Start-Process ngrok -ArgumentList "tcp 5900 --log=stdout"
          Start-Sleep -s 15
          
          $uri = (Invoke-RestMethod http://localhost:4040/api/tunnels).tunnels[0].public_url
          $clean_uri = $uri -replace "tcp://", ""
          
          echo "=========================================="
          echo " ADDRESS: $clean_uri"
          echo " NAME: Windows Master"
          echo " PASSWORD: rohan2026"
          echo "=========================================="

      - name: 4. Keep Alive
        run: |
          $i = 0
          while($i -lt 360) {
            Write-Output "Windows Sentinel is Active..."
            Start-Sleep -s 60
            $i++
          }
